services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly}
      POSTGRES_DB: anomaly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anomaly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    networks:
      - anomaly-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - anomaly-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  anomaly-api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://anomaly:${POSTGRES_PASSWORD:-anomaly}@postgres:5432/anomaly
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: anomaly-evidence
      RUNNER_IMAGE: anomaly-runner:prod
      RUNNER_NETWORK: anomaly-net
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - anomaly-net

  anomaly-web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - anomaly-net

  anomaly-worker:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://anomaly:${POSTGRES_PASSWORD:-anomaly}@postgres:5432/anomaly
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: anomaly-evidence
      RUNNER_IMAGE: anomaly-runner:prod
      RUNNER_NETWORK: anomaly-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anomaly-net

  anomaly-runner:
    image: anomaly-runner:prod
    networks:
      - anomaly-net
    volumes:
      - runner_scratch:/scratch
    command: ["sleep", "infinity"]

networks:
  anomaly-net:
    name: anomaly-net

volumes:
  postgres_data:
  minio_data:
  runner_scratch:


