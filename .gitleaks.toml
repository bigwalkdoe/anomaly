# Gitleaks configuration for anomaly
# Allows known-safe example placeholders; real secrets must never be committed.

[extend]
useDefault = true

[allowlist]
description = "Allow example placeholders and ignore generated/local-only paths in filesystem scans"
paths = [
  '''\.env\.example$''',
  '''apps/web/\.env\.example$''',
  '''(^|/)\.env$''',
  '''(^|/)\.next/''',
  '''(^|/)\.worktrees/''',
  '''(^|/)\.superpowers/''',
]
commits = []
regexTarget = "match"
regexes = [
  '''dev-only-change-me-[0-9a-fA-F]+''',
]
