{{- if .Values.secretKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anomaly.fullname" . }}-secrets
  labels:
    {{- include "anomaly.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secretKeys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
