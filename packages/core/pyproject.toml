[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "minio>=7.2",
]

[tool.setuptools.packages.find]
where = ["src"]